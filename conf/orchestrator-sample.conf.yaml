---
# MySQL backend sample. Replace all credentials and node-specific addresses before use.
RaftNodeID: node-1
RaftDataDir: "/var/lib/orchestrator/raft"
RaftBind: 127.0.0.1:10008
OTelTraceEndpoint: ''
OTelTraceSampleRatio: 0.1
Debug: true
EnableSyslog: false
ListenAddress: ":3000"
MySQLTopologyUser: orc_client_user
MySQLTopologyPassword: orc_client_password
MySQLTopologyCredentialsConfigFile: ''
MySQLTopologySSLPrivateKeyFile: ''
MySQLTopologySSLCertFile: ''
MySQLTopologySSLCAFile: ''
MySQLTopologySSLSkipVerify: true
MySQLTopologyUseMutualTLS: false
MySQLOrchestratorHost: 127.0.0.1
MySQLOrchestratorPort: 3306
MySQLOrchestratorDatabase: orchestrator
MySQLOrchestratorUser: orc_server_user
MySQLOrchestratorPassword: orc_server_password
MySQLOrchestratorCredentialsConfigFile: ''
MySQLOrchestratorSSLPrivateKeyFile: ''
MySQLOrchestratorSSLCertFile: ''
MySQLOrchestratorSSLCAFile: ''
MySQLOrchestratorSSLSkipVerify: true
MySQLOrchestratorUseMutualTLS: false
MySQLConnectTimeoutSeconds: 1
DefaultInstancePort: 3306
DiscoverByShowSlaveHosts: true
InstancePollSeconds: 5
DiscoveryIgnoreReplicaHostnameFilters:
- a_host_i_want_to_ignore[.]example[.]com
- ".*[.]ignore_all_hosts_from_this_domain[.]example[.]com"
- a_host_with_extra_port_i_want_to_ignore[.]example[.]com:3307
UnseenInstanceForgetHours: 240
SnapshotTopologiesIntervalHours: 0
InstanceBulkOperationsWaitTimeoutSeconds: 10
HostnameResolveMethod: default
MySQLHostnameResolveMethod: "@@hostname"
SkipBinlogServerUnresolveCheck: true
ExpiryHostnameResolvesMinutes: 60
RejectHostnameResolvePattern: ''
CandidateInstanceExpireMinutes: 60
AuditLogFile: ''
AuditToSyslog: false
RemoveTextFromHostnameDisplay: ".mydomain.com:3306"
ReadOnly: false
AuthenticationMethod: ''
HTTPAuthUser: ''
HTTPAuthPassword: ''
AuthUserHeader: ''
PowerAuthUsers:
- "*"
ClusterNameToAlias:
  127.0.0.1: test suite
ReplicationLagQuery: ''
DetectClusterAliasQuery: SELECT SUBSTRING_INDEX(@@hostname, '.', 1)
DetectClusterDomainQuery: ''
DetectInstanceAliasQuery: ''
DetectPromotionRuleQuery: ''
DataCenterPattern: "[.]([^.]+)[.][^.]+[.]mydomain[.]com"
PhysicalEnvironmentPattern: "[.]([^.]+[.][^.]+)[.]mydomain[.]com"
DetectSemiSyncEnforcedQuery: ''
ServeAgentsHttp: false
AgentsServerPort: ":3001"
AgentsUseSSL: false
AgentsUseMutualTLS: false
AgentSSLSkipVerify: false
AgentSSLPrivateKeyFile: ''
AgentSSLCertFile: ''
AgentSSLCAFile: ''
AgentSSLValidOUs: []
UseSSL: false
UseMutualTLS: false
SSLSkipVerify: false
SSLPrivateKeyFile: ''
SSLCertFile: ''
SSLCAFile: ''
SSLValidOUs: []
URLPrefix: ''
StatusEndpoint: "/api/status"
StatusOUVerify: false
AgentPollMinutes: 60
UnseenAgentForgetHours: 6
StaleSeedFailMinutes: 60
PseudoGTIDPattern: ''
PseudoGTIDPatternIsFixedSubstring: false
PseudoGTIDMonotonicHint: 'asc:'
DetectPseudoGTIDQuery: ''
BinlogEventsChunkSize: 10000
SkipBinlogEventsContaining: []
ReduceReplicationAnalysisCount: true
# Recovery policies and pre/post hooks are configured in Web -> 恢复配置.
OSCIgnoreHostnameFilters: []
ConsulAddress: ''
ConsulScheme: http
ConsulAclToken: ''
ConsulDatacenter: ''
ConsulTLSCAFile: ''
ConsulTLSCAPath: ''
ConsulTLSCertFile: ''
ConsulTLSPrivateKeyFile: ''
ConsulTLSServerName: ''
ConsulTLSSkipVerify: false
ConsulHttpTimeoutSeconds: 60
ConsulKVStoreProvider: consul
ConsulCrossDataCenterDistribution: false
