---
# SQLite backend sample for a single-node installation.
raft:
  nodeID: node-1
  dataDir: "/var/lib/orchestrator/raft"
  bind: 127.0.0.1:10008
observability:
  tracing:
    endpoint: ''
    sampleRatio: 0.1
logging:
  debug: true
  syslog:
    enabled: false
server:
  listen:
    address: ":3000"
  readOnly: false
  tls:
    enabled: false
    mutualTLS: false
    skipVerify: false
    privateKeyFile: ''
    certFile: ''
    caFile: ''
    validOUs: []
  urlPrefix: ''
  status:
    endpoint: "/api/status"
    verifyOU: false
  web:
    removeTextFromHostname: ".mydomain.com:3306"
mysql:
  connectTimeoutSeconds: 1
metadata:
  type: sqlite
  sqlite:
    dataFile: "/usr/local/orchestrator/orchestrator.sqlite3"
topology:
  mysql:
    user: orc_client_user
    password: orc_client_password
    credentialsConfigFile: ''
    sslPrivateKeyFile: ''
    sslCertFile: ''
    sslCAFile: ''
    sslSkipVerify: true
    useMutualTLS: false
    defaultPort: 3306
  replication:
    lagQuery: ''
  discovery:
    useShowReplicaHosts: true
    pollSeconds: 5
    ignoreReplicaHostnames:
      - a_host_i_want_to_ignore[.]example[.]com
      - ".*[.]ignore_all_hosts_from_this_domain[.]example[.]com"
      - a_host_with_extra_port_i_want_to_ignore[.]example[.]com:3307
    unseenForgetHours: 240
  snapshot:
    intervalHours: 0
  operations:
    bulkWaitTimeoutSeconds: 10
  hostname:
    resolveMethod: default
    mysqlResolveMethod: "@@hostname"
    skipBinlogServerUnresolveCheck: true
    resolveExpiryMinutes: 60
    rejectResolvePattern: ''
  candidate:
    expireMinutes: 60
  classification:
    clusterNameToAlias:
      127.0.0.1: test suite
    detectClusterAliasQuery: SELECT SUBSTRING_INDEX(@@hostname, '.', 1)
    detectClusterDomainQuery: ''
    detectInstanceAliasQuery: ''
    detectPromotionRuleQuery: ''
    dataCenterPattern: "[.]([^.]+)[.][^.]+[.]mydomain[.]com"
    physicalEnvironmentPattern: "[.]([^.]+[.][^.]+)[.]mydomain[.]com"
    detectSemiSyncEnforcedQuery: ''
  analysis:
    reduceCount: true
authentication:
  method: ''
  basic:
    user: ''
    password: ''
  proxy:
    userHeader: ''
  power:
    users:
      - "*"
agents:
  serveHTTP: false
  serverPort: ":3001"
  pollMinutes: 60
  unseenForgetHours: 6
  staleSeedFailMinutes: 60
  tls:
    enabled: false
    mutualTLS: false
    skipVerify: false
    privateKeyFile: ''
    certFile: ''
    caFile: ''
    validOUs: []
pseudoGTID:
  pattern: ''
  patternIsFixedSubstring: false
  monotonicHint: 'asc:'
  detectQuery: ''
  binlogEventsChunkSize: 10000
  skipBinlogContaining: []
audit:
  logFile: ''
  toSyslog: false
# Recovery policies and pre/post hooks are configured in Web -> 恢复配置.
osc:
  ignoreHostnames: []
consul:
  address: ''
  scheme: http
  aclToken: ''
  datacenter: ''
  httpTimeoutSeconds: 60
  tls:
    caFile: ''
    caPath: ''
    certFile: ''
    privateKeyFile: ''
    serverName: ''
    skipVerify: false
  kv:
    provider: consul
    crossDataCenterDistribution: false
