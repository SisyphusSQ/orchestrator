services:
  prometheus:
    image: prom/prometheus:v3.11.3
    ports: ['127.0.0.1:19090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
  grafana:
    image: grafana/grafana:13.0.1
    ports: ['127.0.0.1:13000:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./orchestrator-grafana.json:/var/lib/grafana/dashboards/orchestrator.json:ro
  collector:
    image: otel/opentelemetry-collector:0.148.0
    command: ['--config=/etc/otelcol/config.yaml']
    ports: ['127.0.0.1:14318:4318']
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
  tempo:
    image: grafana/tempo:2.10.0
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
